<h2 id="service">Service and awards</h2>
<p class="service-line"><strong>Reviewer:</strong>
{%- for r in site.data.service.reviewer %} <a href="{{ r.url }}">{{ r.name }}</a> {{ r.years }}{% unless forloop.last %};{% endunless %}{% endfor %}</p>
<ul class="awards">
{%- for a in site.data.service.awards %}
<li>{% if a.url %}<a href="{{ a.url }}">{{ a.text }}</a>{% else %}{{ a.text }}{% endif %}</li>
{%- endfor %}
</ul>
